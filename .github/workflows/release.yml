name: Publish Release
on:
  workflow_dispatch:
jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Get Version
        id: properties
        uses: christian-draeger/read-properties@1.1.1
        with:
          path: "./gradle.properties"
          properties: "version minecraftVersion"

      - name: Build
        run: ./gradlew build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.properties.outputs.version }}
          name: "Ad Astra ${{ steps.properties.outputs.version }}"
          body_path: changelog.md
          files: |
            ./forge/build/libs/!(*-@(dev|sources|dev-shadow)).jar
            ./fabric/build/libs/!(*-@(dev|sources|dev-shadow)).jar
